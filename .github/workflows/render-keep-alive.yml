# Ping periódico al backend en Render (free tier) para reducir cold starts.
# Equivalente a UptimeRobot cada 10–14 min; GitHub Actions no requiere cuenta externa.
name: Render keep-alive

on:
  schedule:
    # Cada 12 minutos (UTC). Render suspende ~15 min sin tráfico.
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GET /healthz
        run: |
          curl -fsS --max-time 90 \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            "https://missingdigitalback.onrender.com/healthz"
