services:
  - type: web
    name: tenant-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput --clear && python manage.py migrate --noinput && python manage.py migrate ecommerce --noinput && python manage.py ensure_ecommerce_schema"
    # También en pre-deploy por si el build no tiene DB (Blueprint)
    preDeployCommand: "python manage.py migrate --noinput && python manage.py migrate ecommerce --noinput && python manage.py ensure_ecommerce_schema"
    startCommand: "python manage.py migrate --noinput && python manage.py migrate ecommerce --noinput && python manage.py ensure_ecommerce_schema && python manage.py seed_superuser && daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.12
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tenant-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tenant-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: missingdigitalback.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        value: https://chever.co
      - key: BACKEND_URL
        value: https://missingdigitalback.onrender.com
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_URL
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: false
      - key: DB_SSL_REQUIRE
        value: true

  - type: redis
    name: tenant-redis
    plan: free
    ipAllowList: []

databases:
  - name: tenant-db
    plan: free
    databaseName: tenant
    user: tenant