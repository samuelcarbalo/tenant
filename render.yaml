services:
  - type: web
    name: tenant-api
    runtime: python
    plan: free
    buildCommand: "mkdir -p staticfiles && pip install -r requirements.txt && python manage.py collectstatic --noinput --settings=config.settings.production && python manage.py migrate ecommerce --noinput --settings=config.settings.production; python manage.py migrate --noinput --settings=config.settings.production; python manage.py ensure_ecommerce_schema && python manage.py ensure_jobs_schema"
    # Aplicar migraciones existentes (nunca makemigrations en Render).
    # migrate usa ';' para que ensure_* corra aunque alguna migración falle a medias.
    preDeployCommand: "python manage.py migrate ecommerce --noinput --settings=config.settings.production; python manage.py migrate --noinput --settings=config.settings.production; python manage.py ensure_ecommerce_schema && python manage.py ensure_jobs_schema"
    startCommand: "uvicorn config.asgi:application --host 0.0.0.0 --port $PORT --timeout-keep-alive 120 --proxy-headers --forwarded-allow-ips='*'"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.12
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tenant-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tenant-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: missingdigitalback.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://chever.co,https://www.chever.co
      - key: CSRF_TRUSTED_ORIGINS
        value: https://chever.co,https://www.chever.co
      - key: FRONTEND_URL
        value: https://chever.co
      - key: BACKEND_URL
        value: https://missingdigitalback.onrender.com
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_URL
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: false
      - key: DB_SSL_REQUIRE
        value: true
      - key: DB_CONN_MAX_AGE
        value: "600"
      - key: DB_CONNECT_TIMEOUT
        value: "10"

  - type: redis
    name: tenant-redis
    plan: free
    ipAllowList: []

databases:
  - name: tenant-db
    plan: free
    databaseName: tenant
    user: tenant